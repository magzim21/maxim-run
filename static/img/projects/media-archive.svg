<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="media archive logo">
	<!-- media archive mark: a glacier peak over a drive; a pulse travels from the drive up into the ice. Own drawing. -->
	<defs>
		<linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e6f6ff" />
			<stop offset="1" stop-color="#4a90c8" />
		</linearGradient>
	</defs>
	<style>
		.pulse { animation: rise 2.6s cubic-bezier(.4, 0, .2, 1) infinite; transform-box: fill-box; transform-origin: center; }
		.led { animation: blink 2.6s steps(1) infinite; }
		.shine { animation: shine 2.6s ease-in-out infinite; }
		@keyframes rise {
			0% { transform: translate(0, 0) scale(1); opacity: 0; }
			10% { opacity: 1; }
			55% { transform: translate(6px, -20px) scale(.9); opacity: 1; }
			80%, 100% { transform: translate(8px, -28px) scale(.4); opacity: 0; }
		}
		@keyframes blink { 0%, 12% { fill: #ff5a4e; } 13%, 100% { fill: #5a2a28; } }
		@keyframes shine { 0%, 55% { opacity: 0; } 70% { opacity: .9; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { opacity: 0; } }
	</style>
	<path d="M8 44 L24 18 L31 28 L38 16 L56 44 Z" fill="url(#ice)" />
	<path d="M24 18 L28.5 25 L26 27 L22 23 Z M38 16 L43 24 L39.5 26.5 L36 22 Z" fill="#ffffff" opacity=".85" />
	<path class="shine" d="M38 16 L56 44 L48 44 L36 22 Z" fill="#ffffff" opacity="0" />
	<rect x="10" y="48" width="44" height="10" rx="3.5" fill="#1b222b" stroke="#9aa5b1" stroke-width="1.6" />
	<rect x="14" y="52" width="18" height="2" rx="1" fill="#3a4552" />
	<circle class="led" cx="48" cy="53" r="2" fill="#ff5a4e" />
	<circle class="pulse" cx="25" cy="50" r="2.6" fill="#ff5a4e" />
</svg>

---
name: main
run-name: ${{ github.actor }} - ${{ github.event.head_commit.message }}
on:
  push:
    branches: [prod]
  pull_request: {}
  workflow_dispatch: {}
jobs:
  tests:
    name: Tests (unit, SEO, i18n, CSP, e2e on phone + desktop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0 # = local Node
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npx --yes -p @commitlint/cli@19 -p @commitlint/config-conventional@19 commitlint --config .githooks/.commitlintrc.yml --from ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1' }} --to HEAD

  release:
    name: Release tag
    runs-on: ubuntu-latest
    needs: [tests, commitlint]
    if: github.ref_name == 'prod' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npx --yes semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
